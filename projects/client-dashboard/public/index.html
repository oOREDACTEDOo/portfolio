<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Dashboard</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #eab308;
      --accent-purple: #a855f7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .header {
      background: var(--bg-secondary);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .last-updated {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-purple {
      background: var(--accent-purple);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .week-header {
      margin-bottom: 2rem;
    }

    .week-header h2 {
      font-size: 1.25rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .summary-card {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 0.75rem;
      border: 1px solid var(--bg-card);
    }

    .summary-card .label {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .summary-card .value {
      font-size: 2rem;
      font-weight: 600;
    }

    .summary-card.overdue .value {
      color: var(--accent-red);
    }

    .summary-card.due .value {
      color: var(--accent-yellow);
    }

    .summary-card.meetings .value {
      color: var(--accent-blue);
    }

    .client-grid {
      display: grid;
      gap: 1.5rem;
    }

    .client-card {
      background: var(--bg-secondary);
      border-radius: 0.75rem;
      border: 1px solid var(--bg-card);
      overflow: hidden;
    }

    .client-header {
      background: var(--bg-card);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .client-name {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .client-badges {
      display: flex;
      gap: 0.5rem;
    }

    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .badge.overdue {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
    }

    .badge.due {
      background: rgba(234, 179, 8, 0.2);
      color: var(--accent-yellow);
    }

    .badge.meetings {
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent-blue);
    }

    .client-content {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .section {
      min-width: 0;
    }

    .section-title {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .item {
      background: var(--bg-card);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .item-title {
      font-size: 0.875rem;
      flex: 1;
      color: var(--text-primary);
      text-decoration: none;
    }

    .item-title:hover {
      text-decoration: underline;
    }

    .item-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .item.overdue {
      border-left: 3px solid var(--accent-red);
    }

    .item.high-priority {
      border-left: 3px solid var(--accent-yellow);
    }

    .ranking-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      text-align: center;
    }

    .ranking-stat {
      padding: 0.5rem;
      background: var(--bg-card);
      border-radius: 0.5rem;
    }

    .ranking-stat .number {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .ranking-stat .label {
      font-size: 0.625rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .ranking-stat.improved .number {
      color: var(--accent-green);
    }

    .ranking-stat.declined .number {
      color: var(--accent-red);
    }

    .fathom-summary {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .fathom-actions {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--bg-primary);
    }

    .fathom-actions li {
      margin-left: 1rem;
      font-size: 0.8125rem;
      margin-bottom: 0.25rem;
    }

    .empty-state {
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-style: italic;
    }

    .auth-banner {
      background: var(--accent-yellow);
      color: var(--bg-primary);
      padding: 1rem 2rem;
      text-align: center;
    }

    .auth-banner a {
      color: var(--bg-primary);
      font-weight: 600;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 50vh;
      font-size: 1.25rem;
      color: var(--text-secondary);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid var(--bg-card);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1rem;
    }

    /* Claude Chat Panel */
    .chat-toggle {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 1000;
    }

    .chat-toggle:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.5);
    }

    .chat-toggle svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    .chat-panel {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 450px;
      height: 100vh;
      background: var(--bg-secondary);
      border-left: 1px solid var(--bg-card);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 1001;
    }

    .chat-panel.open {
      transform: translateX(0);
    }

    .chat-header {
      padding: 1rem 1.5rem;
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bg-primary);
    }

    .chat-header h3 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
    }

    .chat-header h3 span {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .chat-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
    }

    .chat-close:hover {
      color: var(--text-primary);
    }

    .quick-actions {
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--bg-card);
    }

    .quick-btn {
      background: var(--bg-card);
      border: 1px solid var(--bg-primary);
      color: var(--text-secondary);
      padding: 0.375rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 90%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .message.user {
      background: var(--accent-blue);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 0.25rem;
    }

    .message.assistant {
      background: var(--bg-card);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 0.25rem;
    }

    .message.assistant p {
      margin-bottom: 0.5rem;
    }

    .message.assistant p:last-child {
      margin-bottom: 0;
    }

    .message.assistant ul, .message.assistant ol {
      margin-left: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .message.assistant li {
      margin-bottom: 0.25rem;
    }

    .message.assistant strong {
      color: var(--accent-purple);
    }

    .message.thinking {
      background: var(--bg-card);
      color: var(--text-secondary);
      font-style: italic;
    }

    .chat-input-area {
      padding: 1rem;
      border-top: 1px solid var(--bg-card);
      display: flex;
      gap: 0.5rem;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--bg-primary);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 1.5rem;
      font-size: 0.875rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--accent-purple);
    }

    .chat-input::placeholder {
      color: var(--text-secondary);
    }

    .chat-send {
      background: var(--accent-purple);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-send:hover {
      opacity: 0.9;
    }

    .chat-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chat-send svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    /* Markdown-like formatting in messages */
    .message.assistant code {
      background: var(--bg-primary);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-family: monospace;
      font-size: 0.8125rem;
    }

    .message.assistant h4 {
      color: var(--accent-purple);
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
    }

    @media (max-width: 768px) {
      .chat-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      Loading dashboard...
    </div>
  </div>

  <!-- Chat Toggle Button -->
  <button class="chat-toggle" onclick="toggleChat()" title="Ask Claude">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
      <path d="M7 9h10v2H7zm0-3h10v2H7z"/>
    </svg>
  </button>

  <!-- Chat Panel -->
  <div class="chat-panel" id="chat-panel">
    <div class="chat-header">
      <h3><span>Claude</span> Assistant</h3>
      <button class="chat-close" onclick="toggleChat()">&times;</button>
    </div>

    <div class="quick-actions">
      <button class="quick-btn" onclick="quickInsight('weekly-summary')">Weekly Summary</button>
      <button class="quick-btn" onclick="quickInsight('priorities')">Top Priorities</button>
      <button class="quick-btn" onclick="quickInsight('overdue')">Overdue Items</button>
      <button class="quick-btn" onclick="quickInsight('client-health')">Client Health</button>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="message assistant">
        <p>Hi! I'm your dashboard assistant. I can help you:</p>
        <ul>
          <li>Summarise your week and priorities</li>
          <li>Analyse specific clients</li>
          <li>Review meeting notes and action items</li>
          <li>Check QSP progress</li>
          <li>Understand your SEO performance</li>
        </ul>
        <p>What would you like to know?</p>
      </div>
    </div>

    <div class="chat-input-area">
      <input
        type="text"
        class="chat-input"
        id="chat-input"
        placeholder="Ask about your clients, tasks, meetings..."
        onkeypress="handleKeyPress(event)"
      >
      <button class="chat-send" onclick="sendMessage()" id="chat-send">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let chatOpen = false;

    // Chat functions
    function toggleChat() {
      chatOpen = !chatOpen;
      document.getElementById('chat-panel').classList.toggle('open', chatOpen);
      if (chatOpen) {
        document.getElementById('chat-input').focus();
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      addMessage(message, 'user');
      addMessage('Thinking...', 'thinking');

      try {
        const response = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        removeThinking();

        if (response.ok) {
          const data = await response.json();
          addMessage(data.response, 'assistant');
        } else {
          const error = await response.json();
          addMessage(`Error: ${error.error}`, 'assistant');
        }
      } catch (err) {
        removeThinking();
        addMessage('Failed to connect to Claude. Please check your API key.', 'assistant');
      }
    }

    async function quickInsight(type) {
      const labels = {
        'weekly-summary': 'Give me a weekly summary',
        'priorities': 'What are my top priorities?',
        'overdue': 'Show me overdue items',
        'client-health': 'How are my clients doing?'
      };

      addMessage(labels[type], 'user');
      addMessage('Analysing your data...', 'thinking');

      try {
        const response = await fetch(`${API_BASE}/api/insights/${type}`);
        removeThinking();

        if (response.ok) {
          const data = await response.json();
          addMessage(data.response, 'assistant');
        } else {
          const error = await response.json();
          addMessage(`Error: ${error.error}`, 'assistant');
        }
      } catch (err) {
        removeThinking();
        addMessage('Failed to generate insight.', 'assistant');
      }
    }

    function addMessage(content, type) {
      const messages = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `message ${type}`;

      if (type === 'assistant') {
        // Basic markdown-like formatting
        div.innerHTML = formatMessage(content);
      } else {
        div.textContent = content;
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeThinking() {
      const messages = document.getElementById('chat-messages');
      const thinking = messages.querySelector('.message.thinking');
      if (thinking) thinking.remove();
    }

    function formatMessage(text) {
      // Convert markdown-like syntax to HTML
      return text
        // Bold
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // Bullet points
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        // Numbered lists
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        // Wrap consecutive li elements in ul
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        // Headers
        .replace(/^### (.+)$/gm, '<h4>$1</h4>')
        .replace(/^## (.+)$/gm, '<h4>$1</h4>')
        // Line breaks
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>')
        // Wrap in paragraph
        .replace(/^(.+)$/, '<p>$1</p>');
    }

    // Dashboard functions
    async function fetchData() {
      try {
        const response = await fetch(`${API_BASE}/api/data`);
        if (response.ok) {
          return await response.json();
        }
        return null;
      } catch (err) {
        console.error('Error fetching data:', err);
        return null;
      }
    }

    async function checkAuth() {
      try {
        const response = await fetch(`${API_BASE}/api/auth/status`);
        return await response.json();
      } catch (err) {
        return { googleAuth: false };
      }
    }

    async function refreshData() {
      const btn = document.getElementById('refresh-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Refreshing...';
      }

      try {
        const response = await fetch(`${API_BASE}/api/refresh`, { method: 'POST' });
        if (response.ok) {
          const data = await response.json();
          renderDashboard(data);
        } else {
          const error = await response.json();
          if (error.authUrl) {
            window.location.href = error.authUrl;
          } else {
            alert('Error refreshing data: ' + error.error);
          }
        }
      } catch (err) {
        alert('Error refreshing data');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Refresh Data';
        }
      }
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-GB', {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
      });
    }

    function formatTime(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function formatDateTime(dateStr) {
      return `${formatDate(dateStr)} ${formatTime(dateStr)}`;
    }

    function renderDashboard(data) {
      const app = document.getElementById('app');

      if (!data) {
        app.innerHTML = `
          <div class="auth-banner">
            No data available. <a href="#" onclick="refreshData(); return false;">Click here to fetch data</a>
          </div>
          <div class="container">
            <div class="empty-state" style="text-align: center; padding: 4rem;">
              <h2>Welcome to Client Dashboard</h2>
              <p style="margin-top: 1rem;">Click "Refresh Data" to fetch information from all your connected services.</p>
            </div>
          </div>
        `;
        return;
      }

      const { weeklyOverview, lastUpdated } = data;
      const { clients: clientsData } = weeklyOverview;

      // Calculate totals
      let totalOverdue = 0;
      let totalDue = 0;
      let totalMeetings = 0;

      clientsData.forEach(c => {
        totalOverdue += c.tasksOverdue?.length || 0;
        totalDue += c.tasksDue?.length || 0;
        totalMeetings += c.upcomingMeetings?.length || 0;
      });

      app.innerHTML = `
        <header class="header">
          <h1>Client Dashboard</h1>
          <div class="header-actions">
            <span class="last-updated">Last updated: ${formatDateTime(lastUpdated)}</span>
            <button class="btn" id="refresh-btn" onclick="refreshData()">Refresh Data</button>
          </div>
        </header>

        <div class="container">
          <div class="week-header">
            <h2>Week of ${formatDate(weeklyOverview.weekStart)} - ${formatDate(weeklyOverview.weekEnd)}</h2>
          </div>

          <div class="summary-cards">
            <div class="summary-card overdue">
              <div class="label">Overdue Tasks</div>
              <div class="value">${totalOverdue}</div>
            </div>
            <div class="summary-card due">
              <div class="label">Due This Week</div>
              <div class="value">${totalDue}</div>
            </div>
            <div class="summary-card meetings">
              <div class="label">Upcoming Meetings</div>
              <div class="value">${totalMeetings}</div>
            </div>
          </div>

          <div class="client-grid">
            ${clientsData.map(clientData => renderClientCard(clientData)).join('')}
          </div>
        </div>
      `;
    }

    function renderClientCard(clientData) {
      const { client, upcomingMeetings, tasksDue, tasksOverdue, recentMeetings, rankingSnapshot } = clientData;

      const overdueCount = tasksOverdue?.length || 0;
      const dueCount = tasksDue?.length || 0;
      const meetingCount = upcomingMeetings?.length || 0;

      return `
        <div class="client-card">
          <div class="client-header">
            <span class="client-name">${client.name}</span>
            <div class="client-badges">
              ${overdueCount > 0 ? `<span class="badge overdue">${overdueCount} overdue</span>` : ''}
              ${dueCount > 0 ? `<span class="badge due">${dueCount} due</span>` : ''}
              ${meetingCount > 0 ? `<span class="badge meetings">${meetingCount} meetings</span>` : ''}
            </div>
          </div>
          <div class="client-content">
            ${renderTasksSection('Overdue Tasks', tasksOverdue, true)}
            ${renderTasksSection('Due This Week', tasksDue)}
            ${renderMeetingsSection(upcomingMeetings)}
            ${renderRankingsSection(rankingSnapshot)}
            ${renderFathomSection(recentMeetings)}
          </div>
        </div>
      `;
    }

    function renderTasksSection(title, tasks, isOverdue = false) {
      if (!tasks || tasks.length === 0) return '';

      return `
        <div class="section">
          <h4 class="section-title">${title}</h4>
          <div class="item-list">
            ${tasks.slice(0, 5).map(task => `
              <div class="item ${isOverdue ? 'overdue' : ''} ${task.priority === 'High' ? 'high-priority' : ''}">
                <a href="${task.url}" target="_blank" class="item-title">${task.title}</a>
                <span class="item-meta">${task.dueDate ? formatDate(task.dueDate) : 'No date'}</span>
              </div>
            `).join('')}
            ${tasks.length > 5 ? `<div class="empty-state">+${tasks.length - 5} more tasks</div>` : ''}
          </div>
        </div>
      `;
    }

    function renderMeetingsSection(meetings) {
      if (!meetings || meetings.length === 0) return '';

      return `
        <div class="section">
          <h4 class="section-title">Upcoming Meetings</h4>
          <div class="item-list">
            ${meetings.slice(0, 5).map(meeting => `
              <div class="item">
                <span class="item-title">${meeting.title}</span>
                <span class="item-meta">${formatDateTime(meeting.start)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderRankingsSection(ranking) {
      if (!ranking) return '';

      const { positionChanges, averagePosition } = ranking;

      return `
        <div class="section">
          <h4 class="section-title">SEO Rankings</h4>
          <div class="ranking-summary">
            <div class="ranking-stat improved">
              <div class="number">${positionChanges.improved}</div>
              <div class="label">Improved</div>
            </div>
            <div class="ranking-stat declined">
              <div class="number">${positionChanges.declined}</div>
              <div class="label">Declined</div>
            </div>
            <div class="ranking-stat">
              <div class="number">${averagePosition.toFixed(1)}</div>
              <div class="label">Avg Pos</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderFathomSection(meetings) {
      if (!meetings || meetings.length === 0) return '';

      const latestMeeting = meetings[0];

      return `
        <div class="section">
          <h4 class="section-title">Latest Meeting (${formatDate(latestMeeting.date)})</h4>
          <div class="fathom-summary">
            ${latestMeeting.summary.substring(0, 200)}${latestMeeting.summary.length > 200 ? '...' : ''}
            ${latestMeeting.actionItems && latestMeeting.actionItems.length > 0 ? `
              <div class="fathom-actions">
                <strong>Action Items:</strong>
                <ul>
                  ${latestMeeting.actionItems.slice(0, 3).map(item => `<li>${item}</li>`).join('')}
                </ul>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // Initialize
    async function init() {
      const auth = await checkAuth();
      const data = await fetchData();

      if (!auth.googleAuth && !data) {
        document.getElementById('app').innerHTML = `
          <div class="auth-banner">
            Google authentication required. <a href="${auth.authUrl}">Click here to connect</a>
          </div>
          <div class="container">
            <div class="empty-state" style="text-align: center; padding: 4rem;">
              <h2>Setup Required</h2>
              <p style="margin-top: 1rem;">Please connect your Google account to fetch calendar and Fathom data.</p>
            </div>
          </div>
        `;
        return;
      }

      renderDashboard(data);
    }

    init();
  </script>
</body>
</html>
