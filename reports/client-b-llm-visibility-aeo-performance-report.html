function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decrypt(password){
  const salt=b64(D.salt),iv=b64(D.iv),ct=b64(D.ct);
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
  try{
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    return new TextDecoder().decode(plain);
  }catch(e){return null;}
}
document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const pwd=document.getElementById('pwd').value;
  if(!pwd)return;
  const html=await decrypt(pwd);
  if(html){
    document.open();document.write(html);document.close();
    history.replaceState(null,'',location.href);
  }else{
    document.getElementById('err').style.display='block';
    document.getElementById('pwd').value='';
    document.getElementById('pwd').focus();
  }
});
</script>
